<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WhatsApp QR Login</title>
    <style>
        :root {
            --primary: #00a884;
            --primary-dark: #008069;
            --bg-dark: #111b21;
            --card-bg: #222e35;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --danger: #f15c6d;
            --danger-dark: #d14a58;
            --border: #2a3942;
            --input-bg: #2a3942;
            --shadow: rgba(11, 20, 26, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #0c1317 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 32px var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 300;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo-icon {
            color: var(--primary);
            font-size: 28px;
        }

        .qr-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 24px;
            padding: 16px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border: 2px solid var(--primary);
        }

        #qr {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            transition: opacity 0.3s ease;
        }

        .qr-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #f0f0f0 25%, #ffffff 25%, #ffffff 50%, #f0f0f0 50%, #f0f0f0 75%, #ffffff 75%);
            background-size: 20px 20px;
            border-radius: 8px;
            animation: loading 1s linear infinite;
        }

        @keyframes loading {
            0% { background-position: 0 0; }
            100% { background-position: 20px 20px; }
        }

        .status-card {
            background: rgba(42, 57, 66, 0.8);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            border-left: 4px solid var(--primary);
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .status-icon {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: pulse 2s infinite;
        }

        .status-icon.connected {
            background: var(--primary);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #status {
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.5;
        }

        #connection-status {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            padding: 12px;
            background: rgba(42, 57, 66, 0.6);
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
        }

        .user-number {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .otp-section {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .section-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '📱';
            font-size: 18px;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        #otp-number {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        #otp-number:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 168, 132, 0.2);
        }

        #otp-number::placeholder {
            color: var(--text-secondary);
        }

        /* OTP Verification Input Styling */
        #verify-otp {
            width: 100%;
            padding: 16px 20px;
            background: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 8px;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        #verify-otp:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 168, 132, 0.15);
            background: rgba(0, 168, 132, 0.05);
        }

        #verify-otp::placeholder {
            color: var(--text-secondary);
            letter-spacing: normal;
            font-weight: normal;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 168, 132, 0.3);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: var(--danger-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(241, 92, 109, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-icon {
            font-size: 16px;
        }

        .copyright {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* Animation for QR scan */
        .scan-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent 50%, rgba(0, 168, 132, 0.1) 50%);
            background-size: 100% 4px;
            animation: scan 2s linear infinite;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes scan {
            0% { background-position: 0 -100%; }
            100% { background-position: 0 200%; }
        }

        .scanning .scan-animation {
            opacity: 1;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--shadow);
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            background: var(--danger);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo">
            <h1>
                <span class="logo-icon">🔐</span>
                WhatsApp QR Login
            </h1>
        </div>

        <div class="qr-container">
            <img id="qr" src="" alt="QR Code">
            <div class="qr-placeholder" id="qr-placeholder"></div>
            <div class="scan-animation"></div>
        </div>

        <div class="status-card">
            <div class="status-header">
                <div class="status-icon" id="status-icon"></div>
                <div id="status">Waiting for QR code...</div>
            </div>
            <div id="connection-status">Establishing connection...</div>
            <div id="user-info" class="user-info" style="display: none;">
                <div class="user-avatar" id="user-avatar">W</div>
                <div class="user-details">
                    <div class="user-name" id="user-name"></div>
                    <div class="user-number" id="user-number"></div>
                </div>
            </div>
        </div>

        <div class="otp-section">
            <div class="section-title">Send OTP</div>
            <div class="input-group">
                <input type="text"
                       id="otp-number"
                       placeholder="Enter phone number (e.g., +1234567890)"
                       maxlength="15">
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="sendOTP()">
                    <span class="btn-icon">📤</span>
                    Send OTP
                </button>
                <button class="btn btn-danger" onclick="deleteSession()">
                    <span class="btn-icon">🗑️</span>
                    Delete Session
                </button>
            </div>
        </div>

        <div class="verify-section" id="verify-section" style="display: none;">
            <div class="section-title">Verify OTP</div>
            <div class="input-group">
                <input type="text"
                       id="verify-otp"
                       placeholder="Enter 6-digit OTP code"
                       maxlength="6"
                       pattern="[0-9]{6}">
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="verifyOTP()">
                    <span class="btn-icon">✅</span>
                    Verify OTP
                </button>
                <button class="btn btn-secondary" onclick="cancelVerify()">
                    <span class="btn-icon">❌</span>
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <div class="copyright">
        © 2024 WhatsApp QR Login System
    </div>
</div>

<!-- Toast Notification -->
<div class="toast" id="toast"></div>

<script>
    // Password protection
    const PASSWORD = "am_2026@an";
    
    function checkPassword() {
        const enteredPassword = prompt("🔒 Enter password to access:");
        if (enteredPassword !== PASSWORD) {
            alert("❌ Incorrect password!");
            window.location.href = "about:blank";
            return false;
        }
        return true;
    }

    if (!checkPassword()) {
        throw new Error("Access denied");
    }

    // API Configuration
    const API_KEY = "SECRET123";
    const QR_URL = "/qr";
    const STATUS_URL = "/status";
    const DELETE_URL = "/delete-session";
    const OTP_URL = "/send-otp";
    const VERIFY_OTP_URL = "/verify-otp";

    // Store phone number for verification
    let currentPhoneNumber = "";

    // Toast notification function
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast' + (isError ? ' error' : '') + ' show';
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // QR Code loading with animations
    async function loadQR() {
        const qrImg = document.getElementById('qr');
        const qrPlaceholder = document.getElementById('qr-placeholder');
        const qrContainer = document.querySelector('.qr-container');
        
        try {
            const res = await fetch(QR_URL, {
                headers: { "x-api-key": API_KEY }
            });

            if (!res.ok) {
                qrImg.style.display = 'none';
                qrPlaceholder.style.display = 'flex';
                qrContainer.classList.remove('scanning');
                document.getElementById('status').innerText = "QR not available. Waiting for generation...";
                return;
            }

            const data = await res.json();
            if (data.qr) {
                qrImg.src = data.qr;
                qrImg.style.display = 'block';
                qrPlaceholder.style.display = 'none';
                qrContainer.classList.add('scanning');
                document.getElementById('status').innerText = "Scan this QR code with WhatsApp";
                document.getElementById('status-icon').classList.remove('connected');
            } else {
                qrImg.style.display = 'none';
                qrPlaceholder.style.display = 'flex';
                qrContainer.classList.remove('scanning');
                document.getElementById('status').innerText = "QR generated. Please scan...";
            }
        } catch (error) {
            console.error('QR Load Error:', error);
            document.getElementById('status').innerText = "Unable to load QR code";
            qrContainer.classList.remove('scanning');
        }
    }

    // Status checking with user info
    async function loadStatus() {
        try {
            const res = await fetch(STATUS_URL, {
                headers: { "x-api-key": API_KEY }
            });

            if (!res.ok) {
                document.getElementById('connection-status').innerText = "Checking status...";
                return;
            }

            const data = await res.json();
            const userInfo = document.getElementById('user-info');
            const statusIcon = document.getElementById('status-icon');
            
            if (data.status === 'connected' && data.user) {
                // Show user info
                userInfo.style.display = 'flex';
                document.getElementById('user-name').textContent = data.user.name || 'WhatsApp User';
                document.getElementById('user-number').textContent = data.user.number || 'Unknown';
                
                // Set avatar initial
                const avatar = document.getElementById('user-avatar');
                const name = data.user.name || '';
                avatar.textContent = name.charAt(0).toUpperCase();
                
                // Update status
                document.getElementById('connection-status').innerText = "Connected";
                document.getElementById('status').innerText = "WhatsApp is connected";
                statusIcon.classList.add('connected');
                
                // Hide QR if connected
                document.querySelector('.qr-container').style.display = 'none';
            } else {
                // Hide user info
                userInfo.style.display = 'none';
                document.getElementById('connection-status').innerText = "Disconnected";
                statusIcon.classList.remove('connected');
                document.querySelector('.qr-container').style.display = 'block';
            }
        } catch (error) {
            console.error('Status Error:', error);
            document.getElementById('connection-status').innerText = "Connection error";
        }
    }

    // Send OTP with validation
    async function sendOTP() {
        const numberInput = document.getElementById('otp-number');
        const number = numberInput.value.trim();
        const button = document.querySelector('.btn-primary');
        const originalText = button.innerHTML;
        
        if (!number) {
            showToast("Please enter a phone number", true);
            numberInput.focus();
            return;
        }

        // Basic phone number validation
        const phoneRegex = /^\+?[\d\s\-()]+$/;
        if (!phoneRegex.test(number)) {
            showToast("Please enter a valid phone number", true);
            return;
        }

        // Show loading state
        button.innerHTML = '<span class="btn-icon">⏳</span>Sending...';
        button.disabled = true;

        try {
            const res = await fetch(OTP_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-api-key": API_KEY
                },
                body: JSON.stringify({ number })
            });

            const data = await res.json();
            
            if (res.ok) {
                showToast(data.message || "✅ OTP sent successfully");
                currentPhoneNumber = number; // Store phone number for verification
                numberInput.value = "";
                // Show verification section
                document.getElementById('verify-section').style.display = 'block';
                document.getElementById('verify-otp').focus();
            } else {
                showToast(data.error || "❌ Failed to send OTP", true);
            }
        } catch (error) {
            showToast("❌ Error sending OTP: " + error.message, true);
        } finally {
            // Restore button state
            button.innerHTML = originalText;
            button.disabled = false;
        }
    }

    // Delete session with confirmation
    async function deleteSession() {
        if (!confirm("⚠️ Are you sure you want to delete the WhatsApp session?\n\nThis will disconnect you from WhatsApp Web.")) {
            return;
        }

        const button = document.querySelector('.btn-danger');
        const originalText = button.innerHTML;
        
        // Show loading state
        button.innerHTML = '<span class="btn-icon">⏳</span>Deleting...';
        button.disabled = true;
        document.getElementById('status').innerText = "Deleting session...";

        try {
            await fetch(DELETE_URL, {
                method: "POST",
                headers: { "x-api-key": API_KEY }
            });

            showToast("✅ Session deleted successfully");
            
            // Reset UI
            document.getElementById('user-info').style.display = 'none';
            document.querySelector('.qr-container').style.display = 'block';
            
            // Reload QR after delay
            setTimeout(() => {
                loadQR();
                loadStatus();
            }, 2000);
            
        } catch (error) {
            showToast("❌ Error deleting session", true);
        } finally {
            // Restore button state
            button.innerHTML = originalText;
            button.disabled = false;
        }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
        loadQR();
        loadStatus();
        
        // Auto refresh every 5 seconds
        setInterval(loadQR, 5000);
        setInterval(loadStatus, 5000);
        
        // Format phone number input
        const otpInput = document.getElementById('otp-number');
        otpInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 0) {
                value = '+' + value;
            }
            e.target.value = value;
        });
        
        // Enter key support for OTP input
        otpInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendOTP();
            }
        });
    });

    // Verify OTP function
    async function verifyOTP() {
        const otpInput = document.getElementById('verify-otp');
        const otp = otpInput.value.trim();
        const number = currentPhoneNumber; // Use stored phone number
        const button = document.querySelector('#verify-section .btn-primary');
        const originalText = button.innerHTML;

        if (!otp || !number) {
            showToast("Please enter OTP code", true);
            otpInput.focus();
            return;
        }

        // Basic OTP validation
        if (otp.length !== 6 || !/^\d{6}$/.test(otp)) {
            showToast("Please enter a valid 6-digit OTP", true);
            otpInput.focus();
            return;
        }

        // Show loading state
        button.innerHTML = '<span class="btn-icon">⏳</span>Verifying...';
        button.disabled = true;

        try {
            const res = await fetch(VERIFY_OTP_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-api-key": API_KEY
                },
                body: JSON.stringify({ number, otp })
            });

            const data = await res.json();

            if (res.ok && data.verified) {
                showToast("✅ OTP verified successfully!");
                otpInput.value = "";
                // Hide verification section
                document.getElementById('verify-section').style.display = 'none';
            } else {
                showToast(data.error || "❌ Invalid OTP. Please try again.", true);
            }
        } catch (error) {
            showToast("❌ Error verifying OTP: " + error.message, true);
        } finally {
            // Restore button state
            button.innerHTML = originalText;
            button.disabled = false;
        }
    }

    // Cancel verification function
    function cancelVerify() {
        document.getElementById('verify-otp').value = "";
        document.getElementById('verify-section').style.display = 'none';
        showToast("Verification cancelled");
    }

    // Disable right-click context menu
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        showToast("⚠️ Right-click is disabled", true);
    });
</script>

</body>
</html>
